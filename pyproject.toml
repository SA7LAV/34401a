[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hp34401a-gui"
version = "1.0.0"
description = "Linux GUI for HP/Agilent/Keysight 34401A Multimeter"
authors = [{name = "Kalle Hagen", email = "dev@hammarang-solutions.se"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyQt5>=5.15", "pyserial>=3.5"]

[project.scripts]
hp34401a = "main:main"

[project.urls]
Repository = "https://git.cls.net/kalle/Agilent_34401a_GUI"

[tool.setuptools.packages.find]
where = ["."]
